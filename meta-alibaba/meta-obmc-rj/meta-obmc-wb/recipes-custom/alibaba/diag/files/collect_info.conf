# JSON structure description
    this conf is used to collect the part of information you want, and the other is in the Diag profile
    you can extend the configuration area by adding new info types in the format of 'base' below
    each dictionary contains up to four elements: cmd, location, timeout, match_cmd
    cmd: command(s) to collect information
    location: default-/var/log/collect_bmc, format-/var/log/collect_bmc*
    timeout: default-20(s), but there is no time limit in way of python
    match_cmd: default-None, cmd will be executed when the return value of match_cmd is 0
    way: default-shell, other-python
# JSON configuration area
{
    "base":[
        {"cmd":"journalctl -a | cat", "location":"/var/log/collect_bmc_journal", "timeout":180},
        {"cmd":"dmesg | cat"},
        {"cmd":"systemctl list-units|cat"},
        {"cmd":"ifconfig -a"},
        {"cmd":"cat /home/root/.bash_history"},
        {"cmd":"i2cdump -f -y 0 0x0d", "match_cmd":"[ ! -e /etc/device/cpucpld_fpga ]"},
        {"cmd":"i2cdump -f -y 1 0x0d", "match_cmd":"[[ -e /sys/devices/platform/ast-i2c.1/i2c-1/1-000d && ! -e /etc/device/cpucpld_fpga ]]"},
        {"cmd":"i2cdump -f -y 6 0x3d", "match_cmd":"[ -e /etc/device/cpucpld_fpga ]"},
        {"cmd":"i2cdump -f -y 6 0x0d", "match_cmd":"[ -e /etc/device/cpucpld_fpga ]"}
    ],
    "status":[
        {"cmd":"bmc_case.get_status()", "way":"python"},
        {"cmd":"int_case.get_sensor_info()", "way":"python"},
        {"cmd":"int_case.get_fan_info_all()", "way":"python"},
        {"cmd":"int_case.get_psu_info_all()", "way":"python"},
        {"cmd":"misc_case.get_ssd_power_status()", "way":"python"},
        {"cmd":"misc_case.get_switch_chip_power_status()", "way":"python"},
        {"cmd":"misc_case.get_switch_port_power_status()", "way":"python"},
        {"cmd":"misc_case.get_switch_port_power_status()", "way":"python"},
        {"cmd":"misc_case.get_host_cpu_power_status()", "way":"python"},
        {"cmd":"misc_case.get_host_cpu_power_force_control_status()", "way":"python"}
    ],
    "cpld":[
        {"cmd":"i2cdump -f -y 7 0x30", "match_cmd":"[ -e /sys/devices/platform/ast-i2c.7/i2c-7/7-0030 ]"},
        {"cmd":"i2cdump -f -y 7 0x31", "match_cmd":"[ -e /sys/devices/platform/ast-i2c.7/i2c-7/7-0031 ]"},
        {"cmd":"i2cdump -f -y 8 0x30", "match_cmd":"[ -e /sys/devices/platform/ast-i2c.8/i2c-8/8-0030 ]"},
        {"cmd":"i2cdump -f -y 8 0x31", "match_cmd":"[ -e /sys/devices/platform/ast-i2c.8/i2c-8/8-0031 ]"},
        {"cmd":"i2cdump -f -y 9 0x30", "match_cmd":"[ -e /sys/devices/platform/ast-i2c.9/i2c-9/9-0030 ]"},
        {"cmd":"i2cdump -f -y 9 0x31", "match_cmd":"[ -e /sys/devices/platform/ast-i2c.9/i2c-9/9-0031 ]"},
        {"cmd":"i2cdump -f -y 10 0x30", "match_cmd":"[ -e /sys/devices/platform/ast-i2c.10/i2c-10/10-0030 ]"},
        {"cmd":"i2cdump -f -y 10 0x31", "match_cmd":"[ -e /sys/devices/platform/ast-i2c.10/i2c-10/10-0031 ]"},
        {"cmd":"i2cdump -f -y 17 0x30", "match_cmd":"[ -e /sys/devices/platform/ast-i2c.17/i2c-17/17-0030 ]"},
        {"cmd":"i2cdump -f -y 18 0x31", "match_cmd":"[ -e /sys/devices/platform/ast-i2c.18/i2c-18/18-0031 ]"}
    ]
}
