# add by fboss_lite
#
## Sensors
#
CONFIG_SENSORS_LM75=m
CONFIG_SENSORS_LM90=m
CONFIG_SENSORS_AST_ADC=m

#
# TPM drivers
#
CONFIG_TCG_TPM=y
CONFIG_TCG_TIS_SPI=y
CONFIG_SPI_GPIO=y
CONFIG_SPI=y

#
# EEPROM AT93C46 driver
#
CONFIG_EEPROM_AT24=m
CONFIG_EEPROM_93XX46=y
CONFIG_EEPROM_93CX6=y

#
# IPMI
#
CONFIG_IPMI_HANDLER=y
CONFIG_IPMI_KCS_BMC_CDEV_IPMI=y
CONFIG_IPMI_KCS_BMC_CDEV_RAW=y

#
# UBIFS requires 15 KiB as a minimum.
#
CONFIG_MTD_SPI_NOR_USE_4K_SECTORS=n

# add by whitebox
CONFIG_I2C_MUX_PCA9541=n
CONFIG_I2C_MUX_PCA954x=n
CONFIG_PMBUS=n
CONFIG_SENSORS_PMBUS=n
CONFIG_ASPEED_ADC=n

CONFIG_WB_SPI_E2_93XX46=y
CONFIG_IPMB_DEVICE_INTERFACE=y
CONFIG_I2C_SLAVE_MQUEUE=y
CONFIG_RTC_DRV_PCF85063=y
CONFIG_AUTOFS4_FS=y
CONFIG_AUTOFS_FS=y

#
# Network testing
#
CONFIG_NET_PKTGEN=y

#
# USB VHB
#
CONFIG_USB_ASPEED_VHUB=m
CONFIG_USB_LIBCOMPOSITE=y
CONFIG_USB_U_ETHER=y
CONFIG_USB_F_ECM=y
CONFIG_USB_F_EEM=y
CONFIG_USB_F_SUBSET=y
CONFIG_USB_F_RNDIS=y
CONFIG_USB_ETH=y
CONFIG_CONFIGFS_FS=y

#
# DEBUG FS
#
CONFIG_BLK_DEBUG_FS=y
CONFIG_DEBUG_FS=y
CONFIG_DEBUG_FS_ALLOW_ALL=y

#
# File systems
#
CONFIG_FS_IOMAP=y
CONFIG_EXT4_FS=y
CONFIG_EXT4_USE_FOR_EXT2=y
CONFIG_JBD2=y
CONFIG_FS_MBCACHE=y
CONFIG_CRYPTO_CRC32C=y

#
# serial 8250
#
CONFIG_SERIAL_8250_ASPEED=y

#
# peci
#
CONFIG_PECI_ASPEED=n

#
# kpro for find function address
#
CONFIG_KPROBES=y
