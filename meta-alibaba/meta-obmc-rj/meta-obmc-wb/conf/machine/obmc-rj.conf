#@TYPE: Machine
#@NAME: obmc
#@DESCRIPTION: Machine configuration

require conf/machine/include/whitebox_custom.inc
require conf/distro/openbmc-pin-rocko.inc

SERIAL_CONSOLES ?= "115200;ttyS0"

KERNEL_IMAGETYPE = "zImage"

#
# Adjust uboot information
# which will be used as the ALTBMC version
#
INHERIT:remove = "openbmc_version"
INHERIT += "wb_openbmc_version"

#
# Following 3 items need to be updated when switching kernel version:
#   - KERNEL_DEVICETREE:
#     * only used by kernel version 4.17 or higher versions.
#     * if you want to downgrade kernel to v4.1, please remove the line
#       (or comment it out).
#   - PREFERRED_VERSION_linux-aspeed:
#     * set it to the version you like: 4.1.51, 5.0.3 or 5.3.8.
#   - PREFERRED_VERSION_libwatchdog:
#     * version "0.1" for kernel v4.1.
#     * version "0.2" for kernel v4.17 or higher versions.
#

PREFERRED_PROVIDER_virtual/kernel = "linux-kernel"
PREFERRED_VERSION_linux-kernel = "5.15.80"
PREFERRED_VERSION_libwatchdog = "0.2"

#
# Pick up u-boot-v2019.04
#
PREFERRED_VERSION_u-boot = "v2019.04"
PREFERRED_VERSION_u-boot-mkimage = "v2019.04"
PREFERRED_VERSION_u-boot-mkimage-native = "v2019.04"
PREFERRED_VERSION_nativesdk-u-boot-mkimage = "v2019.04"
PREFERRED_VERSION_u-boot-fw-utils = "v2019.04"
PREFERRED_VERSION_u-boot-fw-utils-cross = "v2019.04"

# configuration for preferred version of packages
PREFERRED_VERSION_libipmi = "0.2"
PREFERRED_VERSION_ipmid = "0.2"
PREFERRED_VERSION_rest-api = "0.1"
PREFERRED_VERSION_at93cx6-util = "0.1"
PREFERRED_VERSION_bcm5396-util = "0.1"
PREFERRED_VERSION_fscd = "0.3"
PREFERRED_VERSION_openbmc-gpio = "0.2"
PREFERRED_VERSION_libbic = "0.2"
PREFERRED_VERSION_bic-util = "0.2"
PREFERRED_VERSION_libpal = "0.2"
PREFERRED_VERSION_kcsd = "0.2"

PREFERRED_VERSION_wedge-eeprom ?= "0.1"
PREFERRED_VERSION_libwedge-eeprom ?= "0.1"

VIRTUAL-RUNTIME_base-utils-hwclock = "util-linux-hwclock"

CORE_IMAGE_EXTRA_INSTALL += "ethtool"
CORE_IMAGE_EXTRA_INSTALL += "tcpdump"

MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "           \
    kernel-module-wb-bsp                        \
    "

MACHINE_FEATURES += "emmc emmc-ext4"
#remove kernel cfg/fs/vfat.scc
MACHINE_FEATURES:remove = "vfat"

