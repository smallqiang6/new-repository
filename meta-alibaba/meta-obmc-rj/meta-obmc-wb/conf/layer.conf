# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend \
    ${LAYERDIR}/recipes-product/*/*/*.bb \
    ${LAYERDIR}/recipes-product/*/*/*.bbappend \
    ${LAYERDIR}/recipes-custom/alibaba/*/*.bb \
    ${LAYERDIR}/recipes-custom/alibaba/*/*.bbappend \
	"

BBFILE_COLLECTIONS += "obmc-wb"
BBFILE_PATTERN_obmc-wb = "^${LAYERDIR}/"
BBFILE_PRIORITY_obmc-wb = "25"

DISTRO_FEATURES:append = " systemd usrmerge"
VIRTUAL-RUNTIME_init_manager = "systemd"
DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"
