# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

BBFILE_COLLECTIONS += "general-ast2600"
BBFILE_PATTERN_general-ast2600 := "^${LAYERDIR}/"
BBFILE_PRIORITY_general-ast2600 = "27"
LAYERSERIES_COMPAT_general-ast2600 = "scarthgap nanbield kirkstone dunfell"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/../recipes-product/recipes-AS15-24D8O-RJ/*/*.bb \
            ${LAYERDIR}/../recipes-product/recipes-AS15-24D8O-RJ/*/*.bbappend \
            ${LAYERDIR}/../recipes-product/recipes-AS25-128Q-RJ/*/*.bb \
            ${LAYERDIR}/../recipes-product/recipes-AS25-128Q-RJ/*/*.bbappend \
            ${LAYERDIR}/../recipes-product/recipes-AS15-40Q-RJ/*/*.bb \
            ${LAYERDIR}/../recipes-product/recipes-AS15-40Q-RJ/*/*.bbappend \
            ${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
            "

