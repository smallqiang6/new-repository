#
# @Fill in the agreement
# 1. Complete comments must be filled in before configuration items. Comments must not be filled in the same line of configuration items
# and invalid Spaces must not be added between configuration items
# 2. The configuration item value can be in 10 or hexadecimal format. The hexadecimal value starts with "0x"
# 3. Some configuration items do not need to be filled in in a specific product. In order to facilitate other products to copy and fill in, do not delete them
# 4. Configure items
# Configuration item: cpld device i2c bus address
# Format: cpld_i2C_dev.bus_ [cpld_slot]_[cpld_id] cpld_i2c_dev.addr_[cpld_slot]_[cpld_id]
# All cpld numbers on each product are customized, do not repeat, the number is reflected in the high eight digits of the offset address of the cpld device
# cpld_slot: 1:1, 2: line card 2, and 3: line 3, 4: line card 4, 5: fan switch board,
#			cpld_id: 0:CPLD_A 1:CPLD_B
#.bus number corresponding to the configuration item (/dev/i2c-bus)
#.addr configuration item corresponds to the address of the device on the bus
# Note: This field is optional. If the cpld does not have I2C access, do not enter this field

# Configuration item: the number of CPLD
# Description: Format  dev_num_[main_dev]_[minor_dev]
# Note: main_dev: indicates that the mainboard is 0, the subPLD is 5, and the minor_dev: CPLD is 8
dev_num_0_8=5

# Configuration item: cpld logic_dev patch
# Description: Format cpld_logic_dev_[cpld_slot]_[cpld_id]
#			All cpld numbers of each product are customized and do not have to be repeated.
#			The numbers are reflected in the upper eight digits of the offset address of the cpld device
#			cpld_id: 0:X86_CPLD, 1:MAC_CPLDA, 2:MAC_CPLDB
# Note: This field is optional. This field is not required for CPLDS that are not accessed by logic_dev
cpld_logic_dev_0_0=/dev/cpld0
cpld_logic_dev_0_1=/dev/cpld1
cpld_logic_dev_0_2=/dev/cpld2
cpld_logic_dev_0_3=/dev/cpld3
cpld_logic_dev_0_4=/dev/cpld4

# Configuration item: Access mode of each cpld(LPC/I2C)
# Description: Format mode_cpld_[cpld_slot][cpld_slot]=lpc/i2c/logic_dev, cpld_id is cpld number,Start at 0
# Note: This field is required
mode_cpld_0_0=logic_dev
mode_cpld_0_1=logic_dev
mode_cpld_0_2=logic_dev
mode_cpld_0_3=logic_dev
mode_cpld_0_4=logic_dev

# Configuration item: Name of each cpld
# Description: Format  cpld_name_[cpld_id] cpld_id is cpld number,start with 1
# Note: This field is required
cpld_name_0_0=CPU_CPLD
cpld_name_0_1=BASE_CPLD
cpld_name_0_2=MAC_CPLDA
cpld_name_0_3=MISC_CPLD
cpld_name_0_4=FAN_CPLD


# Configuration item: Model of each cpld
# Description: Format  cpld_type_[cpld_id] cpld_idis cpld number,start with 1
# Note: This field is required
cpld_type_0_0=LATTICE/LCMXO3LF-2100C-5BG256C
cpld_type_0_1=LATTICE/LCMXO3LF-4300C-5BG324C
cpld_type_0_2=LATTICE/LCMXO3LF-4300C-5BG324C
cpld_type_0_3=LATTICE/LCMXO3LF-2100C-5BG256C
cpld_type_0_4=LATTICE/LCMXO2-2000HC-4MG132C


# Configuration item: version register of each CPLD
# Note: Format cpld_version_[cpld_id] cpld_id indicates a cpld number starting from 1
# Note: Required

cpld_version.mode_0_0=config
cpld_version.int_cons_0_0=
cpld_version.src_0_0=file
cpld_version.frmt_0_0=num_bytes
cpld_version.pola_0_0=
cpld_version.fpath_0_0=/dev/cpld0
cpld_version.addr_0_0=0x0
cpld_version.len_0_0=4
cpld_version.bit_offset_0_0=

cpld_version.mode_0_1=config
cpld_version.int_cons_0_1=
