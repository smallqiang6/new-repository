#
# @Fill in the agreement
# 1. Complete comments must be filled in before configuration items. Comments must not be filled in the same line of configuration items
# and invalid Spaces must not be added between configuration items
# 2. The configuration item value can be in 10 or hexadecimal format. The hexadecimal value starts with "0x"
# 3. Some configuration items do not need to be filled in in a specific product. In order to facilitate other products to copy and fill in, do not delete them
# 4. Configure items

# Configuration item: temperature hwmon path
# Format: hwmon_temp[key1]_[key2]
# Note: key1: High 8bit indicates the index of the device, starting from 1; low 8bit indicates the temperature index, starting from 1
# key2: The high 4bit indicates the primary device type, the sub-card is 5, and the low 4bit indicates the temperature type 0:input 1:alias
# 2:type 3:max 4:max_hyst 5:min 6:crit
# mode: str_constant takes the value of str_cons directly and config reads it in the way specified by src
# int_cons:N Original value /(10^N)
# fpath: indicates the first half of the hwmon path
# bit_offset: specifies the number of decimal places. If not configured, the original precision is retained
# str_cons: when mode is str_constant, its value is the result of reading, and when reading from a file, the name of the file being read

# Number of motherboard temperature sensors
dev_num_0_1=2

# Number of main board voltage sensors
dev_num_0_2=1


# value :           0
# alias :           1
# type :            2
# max :             3
# hyst :            4
# min :             5
# crit :            6
# range :           7
# nominal_value :   8
# high :            9
# low :             10

# temp
hwmon_temp.mode_0x0001_0x00=config
hwmon_temp.src_0x0001_0x00=cpld
hwmon_temp.addr_0x0001_0x00=0x00030062
hwmon_temp.frmt_0x0001_0x00=num_bytes
hwmon_temp.len_0x0001_0x00=2
hwmon_temp.pola_0x0001_0x00=positive
hwmon_temp.int_extra1_0x0001_0x00=6
hwmon_temp.mode_0x0001_0x01=str_constant
hwmon_temp.str_cons_0x0001_0x01=SWITCH_TEMP_MAX
hwmon_temp.mode_0x0001_0x02=str_constant
hwmon_temp.str_cons_0x0001_0x02=misc_cpld
hwmon_temp.mode_0x0001_0x03=constant
hwmon_temp.int_cons_0x0001_0x03=105000
hwmon_temp.mode_0x0001_0x05=constant
hwmon_temp.int_cons_0x0001_0x05=-30000


