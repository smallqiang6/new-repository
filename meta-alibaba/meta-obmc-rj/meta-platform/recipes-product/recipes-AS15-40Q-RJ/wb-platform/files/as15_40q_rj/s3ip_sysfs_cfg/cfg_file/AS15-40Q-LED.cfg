#
# @Fill in the agreement
# 1. Complete comments must be filled in before configuration items. Comments must not be filled in the same line of configuration items
# and invalid Spaces must not be added between configuration items
# 2. The configuration item value can be in 10 or hexadecimal format. The hexadecimal value starts with "0x"
# 3. Some configuration items do not need to be filled in in a specific product. In order to facilitate other products to copy and fill in, do not delete them
# 4. Configure items

# Configuration item: LED CPLD register address
# Description: format led_status_[led_id]_[led_index]
# Note: led_id is defined by rg_led_t
# led_index: indicates that there is no index, fill in 0, and indicates that there is an index (such as a fan indicator). The number starts from 1

# Front panel SYS light
led_status.mode_0_0=config
led_status.src_0_0=file
led_status.frmt_0_0=bit
led_status.fpath_0_0=/dev/cpld1
led_status.addr_0_0=0x50
led_status.len_0_0=3
led_status.bit_offset_0_0=0

# Configuration item: The LED light CPLD register value is converted to the standard value
# Description: format led_status_decode_[led_id]_[origin_value] origin_value: indicates the original CPLD value
# led_id defined with LED light type 0- Front panel SYS light
led_status_decode_0_0=0
led_status_decode_0_1=0
led_status_decode_0_2=0
led_status_decode_0_3=5
led_status_decode_0_4=1
led_status_decode_0_5=6
led_status_decode_0_6=2
led_status_decode_0_7=0


