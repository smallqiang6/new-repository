#
# @Fill in the agreement
# 1. Complete comments must be filled in before configuration items. Comments must not be filled in the same line of configuration items
# and invalid Spaces must not be added between configuration items
# 2. The configuration item value can be in 10 or hexadecimal format. The hexadecimal value starts with "0x"
# 3. Some configuration items do not need to be filled in in a specific product. In order to facilitate other products to copy and fill in, do not delete them
# 4. Configure items
# Configuration item: cpld device i2c bus address
# Format: cpld_i2C_dev.bus_ [cpld_slot]_[cpld_id] cpld_i2c_dev.addr_[cpld_slot]_[cpld_id]
# All cpld numbers on each product are customized, do not repeat, the number is reflected in the high eight digits of the offset address of the cpld device
# cpld_slot: 1:1, 2: line card 2, and 3: line 3, 4: line card 4, 5: fan switch board,
#			cpld_id: 0:CPLD_A 1:CPLD_B
#.bus number corresponding to the configuration item (/dev/i2c-bus)
#.addr configuration item corresponds to the address of the device on the bus
# Note: This field is optional. If the cpld does not have I2C access, do not enter this field
# BASE CPLD
cpld_i2c_dev.bus_0_0=0
cpld_i2c_dev.addr_0_0=0x0d
# FAN CPLD
cpld_i2c_dev.bus_0_1=8
cpld_i2c_dev.addr_0_1=0x0d
# CPU CPLD
cpld_i2c_dev.bus_0_2=14
cpld_i2c_dev.addr_0_2=0x0d
# MISC CPLD
cpld_i2c_dev.bus_0_3=62
cpld_i2c_dev.addr_0_3=0x30
# MAC CPLDA
cpld_i2c_dev.bus_0_4=63
cpld_i2c_dev.addr_0_4=0x31
# MAC CPLDB
cpld_i2c_dev.bus_0_5=64
cpld_i2c_dev.addr_0_5=0x31
# LC CPLD
cpld_i2c_dev.bus_0_6=65
cpld_i2c_dev.addr_0_6=0x31

# Configuration item: Access mode of each cpld of the board (LPC/I2C)
# The format is mode_cpld_[cpld_slot][cpld_slot]=lpc/i2c. The value of cpld_id is a cpld ID starting from 0
# Note: Required
mode_cpld_0_0=i2c
mode_cpld_0_1=i2c
mode_cpld_0_2=i2c
mode_cpld_0_3=i2c
mode_cpld_0_4=i2c
mode_cpld_0_5=i2c
mode_cpld_0_6=i2c

# Configuration item: Number of CPLDS on the mainboard
# Format: dev_num_[main_dev]_[minor_dev]
# Note: main_dev: indicates that the mainboard is 0, the subcard is 5, and the minor_dev: CPLD is 8
dev_num_0_8=7

# Configuration item: Name of each cpld
# Note: Format cpld_name_[cpld_id] cpld_id indicates a cpld number starting from 1
# Note: Required
cpld_name_0_0=BASE_CPLD
cpld_name_0_1=FAN_CPLD
cpld_name_0_2=CPU_CPLD
cpld_name_0_3=MISC_CPLD
cpld_name_0_4=MAC_CPLDA
cpld_name_0_5=MAC_CPLDB
cpld_name_0_6=LC_CPLD


# Configuration item: Model of each cpld
# Format: cpld_type_[cpld_id] cpld_id indicates a cpld number starting from 1
# Note: Required
cpld_type_0_0=LATTICE/LCMXO3LF-4300C-6BG324I
