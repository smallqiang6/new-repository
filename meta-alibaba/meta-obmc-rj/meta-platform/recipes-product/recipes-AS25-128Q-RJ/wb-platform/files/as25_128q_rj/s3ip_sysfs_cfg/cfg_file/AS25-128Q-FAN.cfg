#
# @Fill in the agreement
# 1. Complete comments must be filled in before configuration items. Comments must not be filled in the same line of configuration items
# and invalid Spaces must not be added between configuration items
# 2. The configuration item value can be in 10 or hexadecimal format. The hexadecimal value starts with "0x"
# 3. Some configuration items do not need to be filled in in a specific product. In order to facilitate other products to copy and fill in, do not delete them
# 4. Configure items

# Configuration item: E2 i2c bus address
# Format other_i2c_dev.bus_[main_dev]_[dev_index] other_i2c_dev.addr_[main_dev]_[dev_index],
#.bus number corresponding to the configuration item (/dev/i2c-bus)
#.addr configuration item corresponds to the address of the device on the bus
# Note: main_dev is defined in rg_main_dev_type_t. The value of mainboard is 0, fan is 1, and dev_index indicates the device index
other_i2c_dev.bus_1_1=90
other_i2c_dev.addr_1_1=0x50
other_i2c_dev.bus_1_2=89
other_i2c_dev.addr_1_2=0x50
other_i2c_dev.bus_1_3=88
other_i2c_dev.addr_1_3=0x50
other_i2c_dev.bus_1_4=87
other_i2c_dev.addr_1_4=0x50
other_i2c_dev.bus_1_5=86
other_i2c_dev.addr_1_5=0x50

# Configuration item: Fan related constant
# Format: dev_num_[main_dev]_[minor_dev]
# Note: main_dev, fan is 1, minor_dev, 0: does not exist 5: motor

# Number of fans # Configuration item: Constant related to fans
# Format: dev_num_[main_dev]_[minor_dev]
# Note: main_dev, fan is 1, minor_dev, 0: does not exist 5: motor

# Number of fans
dev_num_1_0=5

# Number of motors
dev_num_1_5=2

# Configuration item: Product fan E2 format
# Description: Format fan_e2_mode
# Note: Required
fan_e2_mode=fru

# Configuration item: Mode for reading fan E2
# Description: Format fan_sysfs_name
# Note: If this parameter is not configured, it is read by i2c, otherwise it is read by sysfs
fan_sysfs_name=eeprom

# Configuration item: The number of fan names displayed on the product
# Format: dev_num_[main_dev]_[minor_dev]
# Note: main_dev,FAN is 1, minor_dev, 7: indicates the number of fan names displayed
dev_num_1_7=1

# Configuration item: Number of fan types supported by each fan name
# Fill in instructions: format fan_type_num_[fan_id]
# Note: fan_id starts from 1
fan_type_num_1=1

# Configuration item: Product fan type name
# Fill in instructions: format fan_name_[index1]_[index2]
# Note: index1 indicates the ID of the displayed fan, starting from 1. index2 indicates the names of different fans with the same ID, starting from 1
fan_name_1_1=FAN80-01-F

# Configuration item: Fan name displayed
# Fill in instructions: format decode_fan_name_[index]
# Note: index indicates the displayed fan ID
decode_fan_name_1=FAN80-01-F

# Configuration item: Fan duct type
# Fill in instructions: fan_direction_[direction]_[index]
# direction indicates the air duct type 0: F2B 1: B2F, with index starting from 1
# Note: Required
fan_direction_1_1=0

# Fan speed tolerance
fan_threshold_0x0301_0x11=30
fan_threshold_0x0301_0x12=30

# Maximum fan speed
fan_threshold_0x0201_0x11=18000
fan_threshold_0x0201_0x12=16000

# Minimum fan speed
fan_threshold_0x0101_0x11=2000
fan_threshold_0x0101_0x12=2000

# Configuration item: Fan status CPLD register address
